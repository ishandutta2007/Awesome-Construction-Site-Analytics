<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f59e0b; letter-spacing: 2px; }
      
      /* Animated elements in background */
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.6; }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .scan-line { animation: scanline 4s ease-in-out infinite; }
      .floating { animation: floatDot 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="12"/>
  <circle cx="1000" cy="80" r="180" fill="url(#glow)"/>

  <!-- Background Animated Scanline & HUD Graphics (Kept behind text) -->
  <g opacity="0.25">
    <path d="M 750 220 L 850 140 L 950 180 L 1050 90 L 1150 130" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,6"/>
    <circle cx="850" cy="140" r="5" fill="#3b82f6"/>
    <circle cx="950" cy="180" r="5" fill="#3b82f6"/>
    <circle cx="1050" cy="90" r="5" fill="#10b981"/>
    
    <!-- 3D Bounding Box Graphic -->
    <path d="M 980 180 L 1060 140 L 1120 170 L 1040 210 Z" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 980 180 L 980 230 L 1040 260 L 1040 210 Z" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 1120 170 L 1120 220 L 1040 260" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accent-grad)" stroke-width="6" />
  
  <!-- Dynamic Scanning Overlay -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#f59e0b" stroke-width="2" opacity="0.5" class="scan-line"/>

  <!-- Foreground Content (Text & Pill Badges) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <text x="0" y="85" class="tag">CURATED ECOSYSTEM &amp; REPOSITORY</text>
    
    <!-- Main Title -->
    <text x="0" y="140" class="title">🏗️ Construction Site Analytics</text>
    
    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Reality Capture • Progress AI • Computer Vision • Drone Analytics • BIM</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="21" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="600" text-anchor="middle">⚡ SaaS Index</text>
      
      <rect x="142" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="224" y="21" font-family="sans-serif" font-size="12" fill="#3b82f6" font-weight="600" text-anchor="middle">🛸 Open-Source Tools</text>

      <rect x="319" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="396" y="21" font-family="sans-serif" font-size="12" fill="#10b981" font-weight="600" text-anchor="middle">🎯 Reality-to-BIM</text>
    </g>
  </g>
</svg>
